[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "avva-newsletter"
version = "0.1.0"
description = "Official Python SDK for the AVVA Newsletter API (/api/v1)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "AVVA" }]
keywords = ["newsletter", "email", "transactional", "api", "sdk", "avva"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
test = ["pytest>=7.0", "responses>=0.24"]

[project.urls]
Homepage = "https://github.com/avva/avva-newsletter-python"
Documentation = "https://github.com/avva/avva-newsletter-python#readme"
Source = "https://github.com/avva/avva-newsletter-python"
Issues = "https://github.com/avva/avva-newsletter-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/newsletter"]

[tool.hatch.build.targets.sdist]
include = ["src/newsletter", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
